<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PA Modes Test</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 1rem auto; padding: 0 1rem; }
  h2 { border-bottom: 1px solid #8884; padding-bottom: .25rem; margin-top: 1.5rem; }
  fieldset { border: 1px solid #8884; border-radius: 6px; padding: .75rem 1rem; margin-bottom: 1rem; }
  legend { font-weight: 600; }
  button { padding: .4rem .9rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select { padding: .3rem .5rem; font: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .35rem .5rem; border-bottom: 1px solid #8884; text-align: left; }
  tr.selected { background: #4a90e220; }
  tr:hover { background: #8881; cursor: pointer; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 130px 1fr; gap: .4rem .8rem; max-width: 380px; }
  .badge { padding: .15rem .5rem; border-radius: 10px; font-size: .8rem; }
  .ok { background: #2ecc7140; color: #1a8244; }
  .bad { background: #e74c3c40; color: #a82418; }
  .log { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; background: #8881; padding: .6rem; border-radius: 6px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  .muted { opacity: .7; font-size: .85rem; }
</style>
</head>
<body>

<h1>PA Modes Test Console</h1>

<fieldset>
  <legend>1. Scan & connect</legend>
  <div class="row">
    <label>Duration (s) <input id="dur" type="number" value="5" min="1" max="30" style="width:5rem"></label>
    <button id="btnScan">Scan</button>
    <span id="scanState" class="muted"></span>
  </div>
  <div class="row" style="margin-top:.5rem">
    <label>Filter name <input id="fName" value="CATM2"></label>
    <label>Filter addr <input id="fAddr" value="80:E1:27:1F:D8:B8"></label>
    <button id="btnDisc">Disconnect</button>
    <span id="connState" class="badge bad">disconnected</span>
  </div>
  <table id="tbl" style="margin-top:.6rem">
    <thead><tr><th>Name</th><th>Address</th><th>RSSI</th></tr></thead>
    <tbody></tbody>
  </table>
</fieldset>

<fieldset>
  <legend>2. Lora CW Debug</legend>
  <div class="grid">
    <label>Freq (Hz)</label>     <input id="freq" type="number" value="917300000">
    <label>Power (dBm)</label>   <input id="pow" type="number" value="14" min="0" max="255">
    <label>PaDutyCycle</label>   <input id="duty" type="number" value="4" min="0" max="255">
    <label>HpMax</label>         <input id="hp" type="number" value="1" min="0" max="255">
    <label>PaMode</label>        <input value="AUTO (0x02)" disabled>
  </div>
  <div class="row" style="margin-top:.6rem">
    <button id="btnStart">Send CW</button>
    <button id="btnStop">Stop test</button>
  </div>
</fieldset>

<fieldset>
  <legend>3. Sweep test (PaDutyCycle × HpMax)</legend>
  <div class="grid">
    <label>Freq (Hz)</label>      <input id="sFreq" type="number" value="917300000">
    <label>Power values</label>   <input id="sPow"  value="1-22">
    <label>Duty values</label>    <input id="sDuty" value="1-4">
    <label>HpMax values</label>   <input id="sHp"   value="1-7">
    <label>Settle (ms)</label>    <input id="sSettle" type="number" value="250" min="0" max="10000">
  </div>
  <div class="row" style="margin-top:.5rem;gap:1rem">
    <label>PWR serial <input id="pwSerial" placeholder="(auto)" style="width:9rem"></label>
    <label>DC resource <input id="cmRes" value="USB0::0x0957::0x0F07::MY50000200::INSTR" style="width:18rem"></label>
    <label>Ch <input id="cmCh" type="number" value="3" min="1" max="4" style="width:3.5rem"></label>
  </div>
  <div class="row" style="margin-top:.6rem">
    <button id="btnRun">Run sweep</button>
    <button id="btnCancel">Cancel</button>
    <button id="btnExport">Export Excel</button>
    <span id="runState" class="badge bad">idle</span>
    <span id="runProg" class="muted"></span>
  </div>
  <div style="margin-top:.6rem">
    <div style="background:#8881;border-radius:6px;height:18px;overflow:hidden">
      <div id="pbar" style="height:100%;width:0%;background:#4a90e2;transition:width .3s"></div>
    </div>
    <div id="pbarText" class="muted" style="margin-top:.25rem">—</div>
    <div id="lastRow" class="muted" style="margin-top:.25rem;font-family:ui-monospace,Consolas,monospace">—</div>
  </div>
</fieldset>

<fieldset>
  <legend>Log</legend>
  <div class="row" style="margin-bottom:.4rem">
    <button id="btnClear">Clear</button>
  </div>
  <div id="log" class="log"></div>
</fieldset>

<script>
const API = "";  // same origin
let devices = [];
let selectedAddr = null;

const $ = (id) => document.getElementById(id);
const log = (msg, data) => {
  const t = new Date().toISOString().slice(11, 19);
  const line = data === undefined ? `[${t}] ${msg}` : `[${t}] ${msg}\n${typeof data === "string" ? data : JSON.stringify(data, null, 2)}`;
  $("log").textContent = line + "\n\n" + $("log").textContent;
};

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

function renderDevices() {
  const nameF = $("fName").value.trim().toLowerCase();
  const addrF = $("fAddr").value.trim().toLowerCase();
  const tbody = $("tbl").querySelector("tbody");
  tbody.innerHTML = "";
  for (const d of devices) {
    const n = (d.name || "").toLowerCase();
    const a = d.address.toLowerCase();
    if (nameF && !n.includes(nameF)) continue;
    if (addrF && !a.includes(addrF)) continue;
    const tr = document.createElement("tr");
    if (d.address === selectedAddr) tr.classList.add("selected");
    tr.innerHTML = `<td>${d.name || "<i>unnamed</i>"}</td><td>${d.address}</td><td>${d.rssi ?? ""}</td>`;
    tr.addEventListener("click", () => connectTo(d.address));
    tbody.appendChild(tr);
  }
}

async function refreshStatus() {
  try {
    const s = await api("/ble/status");
    setConn(s);
  } catch (e) { /* ignore */ }
}

function setConn(s) {
  const el = $("connState");
  if (s.connected) {
    selectedAddr = s.address;
    if (s.transport_ready) {
      el.className = "badge ok";
      el.textContent = `ready: ${s.name || "?"} @ ${s.address} (w:${short(s.write_uuid)} n:${short(s.notify_uuid)})`;
    } else {
      el.className = "badge bad";
      el.textContent = `connected but transport FAIL: ${s.transport_error || "unknown"}`;
    }
  } else {
    selectedAddr = null;
    el.className = "badge bad";
    el.textContent = "disconnected";
  }
  renderDevices();
}
function short(u) { return u ? u.slice(0, 8) : "—"; }

$("btnScan").addEventListener("click", async () => {
  const dur = parseFloat($("dur").value) || 5;
  $("scanState").textContent = `scanning ${dur}s…`;
  $("btnScan").disabled = true;
  try {
    devices = await api(`/ble/scan?duration=${dur}`);
    devices.sort((a, b) => (b.rssi ?? -999) - (a.rssi ?? -999));
    log(`Scan found ${devices.length} device(s)`);
    renderDevices();
  } catch (e) {
    log("Scan error: " + e.message);
  } finally {
    $("scanState").textContent = "";
    $("btnScan").disabled = false;
  }
});

$("fName").addEventListener("input", renderDevices);
$("fAddr").addEventListener("input", renderDevices);

async function connectTo(addr) {
  log("Connecting to " + addr + "…");
  try {
    const s = await api("/ble/connect", {
      method: "POST",
      body: JSON.stringify({ address: addr, timeout: 15 }),
    });
    log("Connect OK", s);
    setConn(s);
  } catch (e) {
    log("Connect error: " + e.message);
  }
}

$("btnDisc").addEventListener("click", async () => {
  try {
    const s = await api("/ble/disconnect", { method: "POST" });
    log("Disconnected", s);
    setConn(s);
  } catch (e) {
    log("Disconnect error: " + e.message);
  }
});

$("btnStart").addEventListener("click", async () => {
  const body = {
    freq_hz: parseInt($("freq").value, 10),
    power_dbm: parseInt($("pow").value, 10),
    pa_duty_cycle: parseInt($("duty").value, 10),
    hp_max: parseInt($("hp").value, 10),
    timeout: 5,
  };
  log("CW request", body);
  try {
    const r = await api("/device/lora-cw", { method: "POST", body: JSON.stringify(body) });
    log(`CW reply ok=${r.ok} status=${r.status}\nTX: ${r.tx_hex}\nRX: ${r.rx_hex}`);
  } catch (e) {
    log("CW error: " + e.message);
  }
});

$("btnStop").addEventListener("click", async () => {
  try {
    const r = await api("/device/stop", { method: "POST", body: JSON.stringify({ timeout: 5 }) });
    log(`Stop reply ok=${r.ok} status=${r.status}\nTX: ${r.tx_hex}\nRX: ${r.rx_hex}`);
  } catch (e) {
    log("Stop error: " + e.message);
  }
});

$("btnClear").addEventListener("click", () => { $("log").textContent = ""; });

// ---------- Sweep ----------
// Accept "0,1,2" or "1-7" or mix "1-3,5,7"
function parseList(s) {
  const out = [];
  for (const tok of s.split(",").map(x => x.trim()).filter(Boolean)) {
    const m = tok.match(/^(-?\d+)\s*-\s*(-?\d+)$/);
    if (m) {
      const a = parseInt(m[1], 10), b = parseInt(m[2], 10);
      const step = a <= b ? 1 : -1;
      for (let v = a; step > 0 ? v <= b : v >= b; v += step) out.push(v);
    } else {
      out.push(parseInt(tok, 10));
    }
  }
  return out;
}

$("btnRun").addEventListener("click", async () => {
  const config = {
    freq_hz: parseInt($("sFreq").value, 10),
    power_values: parseList($("sPow").value),
    duty_values: parseList($("sDuty").value),
    hp_values: parseList($("sHp").value),
    settle_ms: parseInt($("sSettle").value, 10),
  };
  const body = {
    config,
    power_sensor_serial: $("pwSerial").value.trim() || null,
    dc_analyzer_resource: $("cmRes").value.trim() || null,
    dc_analyzer_channel: parseInt($("cmCh").value, 10) || 1,
  };
  log("Sweep start", body);
  // Reset visuals
  $("pbar").style.width = "0%";
  $("pbarText").textContent = "0/0 (0%)";
  $("lastRow").textContent = "—";
  lastState = "idle";
  try {
    await api("/test/run", { method: "POST", body: JSON.stringify(body) });
    pollSweep();
  } catch (e) {
    log("Sweep start error: " + e.message);
  }
});

$("btnCancel").addEventListener("click", async () => {
  try { await api("/test/cancel", { method: "POST" }); } catch (e) { log("Cancel error: " + e.message); }
});

$("btnExport").addEventListener("click", triggerExport);

let pollTimer = null;
let lastState = "idle";
async function pollSweep() {
  clearTimeout(pollTimer);
  try {
    const s = await api("/test/status");
    const el = $("runState");
    el.textContent = s.state;
    el.className = "badge " + (s.state === "running" ? "ok" : (s.state === "error" || s.state === "cancelled" ? "bad" : "ok"));
    const pct = s.total > 0 ? Math.round(s.completed / s.total * 100) : 0;
    $("pbar").style.width = pct + "%";
    $("pbarText").textContent = `${s.completed}/${s.total} (${pct}%)` + (s.error ? ` — ${s.error}` : "");
    $("runProg").textContent = "";
    const r = s.last_row;
    if (r) {
      const mA = r.current_a == null ? "—" : (r.current_a * 1000).toFixed(2);
      $("lastRow").textContent =
        `last: hp=0x${r.hp_max.toString(16).padStart(2,"0")} duty=0x${r.pa_duty_cycle.toString(16).padStart(2,"0")} ` +
        `Pset=${r.power_dbm_setting} → Pmeas=${r.tx_power_dbm ?? "—"} dBm  I=${mA} mA  ${r.ok ? "✓" : "✗"}`;
    }
    if (s.state === "running") {
      pollTimer = setTimeout(pollSweep, 500);
    } else if (lastState === "running") {
      log(`Sweep ${s.state} (${s.completed}/${s.total})` + (s.error ? ` — ${s.error}` : ""));
    }
    lastState = s.state;
  } catch (e) {
    log("Poll error: " + e.message);
  }
}

async function triggerExport() {
  try {
    const res = await fetch("/test/export");
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.detail || res.statusText);
    }
    const blob = await res.blob();
    const cd = res.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    const fname = m ? m[1] : "results.xlsx";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    log("Exported " + fname);
  } catch (e) {
    log("Export error: " + e.message);
  }
}

refreshStatus();
pollSweep();
</script>
</body>
</html>
